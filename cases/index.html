<style>
/* Layout: chunky mobile study app — rounded type, big pill buttons with a pressed edge, one question per screen, sticky XP header */
:root {
  --bg: #F3F2FA;
  --surface: #FFFFFF;
  --ink: #1C1A2E;
  --muted: #6B6889;
  --line: #E2E0F0;
  --brand: #19B37A;
  --brand-deep: #0E8A5D;
  --brand-soft: #DDF6EA;
  --pop: #7B5CFF;
  --pop-deep: #5A3DE0;
  --pop-soft: #ECE7FF;
  --sun: #FFC93C;
  --sun-soft: #FFF4D2;
  --ok: #19B37A;
  --ok-deep: #0E8A5D;
  --ok-soft: #DDF6EA;
  --ng: #FF5A6E;
  --ng-deep: #D93A4F;
  --ng-soft: #FFE3E7;
  --on: #FFFFFF;
  --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111B; --surface: #1D1B2B; --ink: #F1EFFA; --muted: #A6A2C4; --line: #2E2B44;
    --brand: #2FD394; --brand-deep: #179E6B; --brand-soft: #173428;
    --pop: #9A82FF; --pop-deep: #6F52F0; --pop-soft: #27213F;
    --sun: #FFD25C; --sun-soft: #3A3220;
    --ok: #2FD394; --ok-deep: #179E6B; --ok-soft: #173428;
    --ng: #FF7385; --ng-deep: #D94A5E; --ng-soft: #3B1F26; --on: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111B; --surface: #1D1B2B; --ink: #F1EFFA; --muted: #A6A2C4; --line: #2E2B44;
  --brand: #2FD394; --brand-deep: #179E6B; --brand-soft: #173428;
  --pop: #9A82FF; --pop-deep: #6F52F0; --pop-soft: #27213F;
  --sun: #FFD25C; --sun-soft: #3A3220;
  --ok: #2FD394; --ok-deep: #179E6B; --ok-soft: #173428;
  --ng: #FF7385; --ng-deep: #D94A5E; --ng-soft: #3B1F26; --on: #FFFFFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: clip; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 16px; line-height: 1.7; font-weight: 500; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 12px;
}
.top-row { display: flex; align-items: center; gap: 8px; }
.brand { font-weight: 800; font-size: 15px; color: var(--ink); letter-spacing: .02em; }
.reload { margin-right: auto; flex: none; font: inherit; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--pop); border-radius: 999px; padding: 2px 8px 2px 6px; white-space: nowrap; }
.reload svg { width: 13px; height: 13px; }
.reload:active { transform: translateY(1px); }
.reload:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
.reload.spin svg { animation: spin .8s linear infinite; }
.brand { flex: none; }
@media (max-width: 420px) { #rolePill { display: none; } #voiceLbl { display: none; } .voice { padding: 4px 8px; } }
.brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.role-pill, .xp { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.role-pill { background: var(--pop-soft); color: var(--pop); }
.xp { background: var(--sun-soft); color: var(--ink); font-variant-numeric: tabular-nums; }
.xp b { color: var(--sun); -webkit-text-stroke: .3px var(--ink); }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 12px; }
.steps div { min-width: 0; }
.steps i { display: block; height: 10px; border-radius: 99px; background: var(--line); }
.steps span { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .done i { background: var(--brand); }
.steps .now i { background: linear-gradient(90deg, var(--brand) 0 50%, var(--line) 50%); }
.steps .now span { color: var(--brand-deep); }

/* main */
main { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 130px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--pop); background: var(--pop-soft); padding: 4px 12px; border-radius: 999px; }
h1, h2 { font-weight: 800; margin: 0; text-wrap: balance; line-height: 1.35; letter-spacing: .01em; }
h1 { font-size: 32px; }
h1 em { font-style: normal; background: linear-gradient(transparent 60%, var(--sun) 60%); }
h2 { font-size: 24px; }
p { margin: 0; }
.lead { color: var(--muted); }
.media { border-radius: 22px; overflow: hidden; background: var(--pop-soft); aspect-ratio: 16 / 9; max-width: 100%; box-shadow: 0 4px 0 var(--line); }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cap { font-size: 12.5px; color: var(--muted); margin-top: -6px; }

.aim { background: var(--brand-soft); border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; }
.aim-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.aim-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--on); background: var(--brand-deep); border-radius: 999px; padding: 3px 0; text-align: center; margin-top: 3px; }
:root:not([data-theme="light"]) .aim-k { background: var(--brand); color: var(--on-herb, #0E1513); }
.aim p { font-size: 14px; line-height: 1.65; min-width: 0; }
.aim b { color: var(--brand-deep); }
:root:not([data-theme="light"]) .aim b { color: var(--brand); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px; }
.kv { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px 12px; font-size: 15px; }
.kv dt { color: var(--muted); font-size: 12px; font-weight: 800; padding-top: 3px; }
.kv dd { margin: 0; min-width: 0; font-weight: 700; }
.unk { color: var(--muted); font-size: 14px; font-weight: 500; }
.kv dd.unk { font-weight: 500; }

.q { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border-radius: 20px; padding: 14px; border: 2px solid var(--line); }
.q b { flex: none; width: 34px; height: 34px; border-radius: 12px; background: var(--pop); color: var(--on); display: grid; place-items: center; font-size: 15px; font-weight: 800; transform: rotate(-6deg); }
.q p { font-weight: 800; font-size: 17px; line-height: 1.6; min-width: 0; }

.opts { display: grid; gap: 10px; }
.opt {
  font: inherit; font-weight: 700; text-align: left; width: 100%; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 18px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; min-height: 56px;
  box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s, background .15s;
}
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt:focus-visible, .btn:focus-visible, .seg button:focus-visible, .herb:focus-visible, .role:focus-visible { outline: 3px solid var(--pop); outline-offset: 3px; }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 800; color: var(--muted); }
.opt.multi .k { border-radius: 8px; }
.opt .t { min-width: 0; }
.opt .t small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; font-weight: 500; }
.opt.sel { border-color: var(--pop); background: var(--pop-soft); box-shadow: 0 4px 0 var(--pop); }
.opt.sel .k { background: var(--pop); border-color: var(--pop); color: var(--on); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 4px 0 var(--ok); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: var(--on); }
.opt.wrong { border-color: var(--ng); background: var(--ng-soft); box-shadow: 0 4px 0 var(--ng); }
.opt.wrong .k { background: var(--ng); border-color: var(--ng); color: var(--on); }
.opt[disabled] { cursor: default; }
.opt .why { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink); margin-top: 4px; line-height: 1.55; }

.seg-row { display: grid; gap: 6px; }
.seg-row label { font-size: 13px; font-weight: 800; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg button {
  font: inherit; font-weight: 800; font-size: 20px; cursor: pointer; padding: 10px; border-radius: 18px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.seg button:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.seg button.sel { border-color: var(--pop); background: var(--pop-soft); color: var(--pop); box-shadow: 0 4px 0 var(--pop); }
.seg button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok-deep); box-shadow: 0 4px 0 var(--ok); }
.seg button.wrong { border-color: var(--ng); background: var(--ng-soft); color: var(--ng-deep); box-shadow: 0 4px 0 var(--ng); }

.fb { border-radius: 20px; padding: 16px; display: grid; gap: 6px; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
.fb.good { background: var(--ok-soft); }
.fb.bad { background: var(--ng-soft); }
.fb .verdict { font-weight: 800; font-size: 22px; }
.fb.good .verdict { color: var(--ok-deep); }
.fb.bad .verdict { color: var(--ng-deep); }
:root:not([data-theme="light"]) .fb.good .verdict { color: var(--ok); }
.fb.good .verdict::after { content: "  ＋1"; font-size: 14px; color: var(--ink); background: var(--sun); border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: 3px; }
.fb.bad .verdict::after { content: ""; }
.fb ul, .panel ul { margin: 0; padding-left: 1.2em; }
.fb li, .panel li { margin: 3px 0; }
.caution { font-size: 14px; font-weight: 700; color: var(--ng-deep); background: var(--ng-soft); border-radius: 14px; padding: 10px 14px; }

.tip { background: var(--sun-soft); border-radius: 20px; padding: 14px 16px; font-size: 14.5px; border: 2px dashed var(--sun); }
.tip strong { display: table; font-size: 12px; font-weight: 800; color: var(--ink); background: var(--sun); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }

.term { border-bottom: 2px dotted var(--pop); cursor: help; background: none; border-top: 0; border-left: 0; border-right: 0; font: inherit; color: inherit; padding: 0; }
.gloss { font-size: 14px; background: var(--pop-soft); color: var(--ink); border-radius: 14px; padding: 8px 12px; }

.big-sho { background: linear-gradient(135deg, var(--pop), var(--brand)); color: var(--on); border-radius: 24px; padding: 20px; text-align: center; box-shadow: 0 6px 0 var(--pop-deep); }
.big-sho .s { font-size: 13px; font-weight: 800; opacity: .9; }
.big-sho .n { font-size: 44px; font-weight: 800; letter-spacing: .08em; line-height: 1.3; }

.herbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.herb {
  font: inherit; cursor: pointer; border: 2px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 22px; padding: 14px 10px; min-height: 128px; display: grid; place-items: center; text-align: center; gap: 2px;
  box-shadow: 0 5px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.herb:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.herb .hn { font-size: 30px; font-weight: 800; line-height: 1.2; }
.herb .hr { font-size: 12px; color: var(--muted); }
.herb .hd { font-size: 14px; line-height: 1.5; font-weight: 700; }
.herb.open { background: var(--brand-soft); border-color: var(--brand); box-shadow: 0 5px 0 var(--brand); }

.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role {
  font: inherit; cursor: pointer; padding: 14px 10px; border-radius: 18px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 800; font-size: 16px; box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s;
}
.role:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.role small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.role.sel { border-color: var(--pop); background: var(--pop-soft); color: var(--pop); box-shadow: 0 4px 0 var(--pop); }

.score { display: flex; align-items: baseline; gap: 8px; background: linear-gradient(135deg, var(--sun-soft), var(--pop-soft)); border: 0; }
.score .num { font-size: 64px; font-weight: 800; color: var(--pop); line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { color: var(--ink); font-weight: 800; }
.take { display: grid; gap: 10px; counter-reset: t; }
.take div { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; background: var(--surface); border-radius: 18px; padding: 12px; border: 2px solid var(--line); }
.take div::before { counter-increment: t; content: counter(t); width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: var(--on); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.take p { min-width: 0; }
.refs { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.refs summary { cursor: pointer; font-weight: 800; }
.refs a { color: var(--pop); word-break: break-all; }

.voice { font: inherit; font-size: 12px; font-weight: 800; border: 0; border-radius: 999px; padding: 4px 10px 4px 8px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; background: var(--brand-soft); color: var(--brand-deep); white-space: nowrap; }
:root:not([data-theme="light"]) .voice { color: var(--brand); }
.voice[aria-pressed="false"] { background: var(--line); color: var(--muted); }
.voice:focus-visible, .say:focus-visible { outline: 3px solid var(--pop); outline-offset: 2px; }
.say { flex: none; margin-left: auto; font: inherit; font-size: 12px; font-weight: 800; border: 2px solid var(--line); background: var(--surface); color: var(--pop); border-radius: 12px; padding: 4px 8px; display: inline-flex; align-items: center; gap: 2px; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.say.speaking { background: var(--pop); color: var(--on); border-color: var(--pop); box-shadow: 0 3px 0 var(--pop-deep); }
.say:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.q { align-items: center; }
.voice-set { display: grid; gap: 8px; }
.voice-set label { font-weight: 800; font-size: 14px; }
.voice-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.voice-row select { font: inherit; font-size: 14px; min-width: 0; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 10px; }
.voice-row .btn { font-size: 14px; padding: 8px 12px; box-shadow: 0 3px 0 var(--line); }

.finish { position: relative; overflow: hidden; text-align: center; border-radius: 28px; padding: 22px 16px 20px; display: grid; justify-items: center; gap: 4px;
  background: linear-gradient(160deg, var(--pop-soft), var(--sun-soft) 60%, var(--brand-soft)); }
.rays { position: absolute; left: 50%; top: 92px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; pointer-events: none;
  background: repeating-conic-gradient(var(--rank) 0 8deg, transparent 8deg 24deg); opacity: .14; animation: spin 18s linear infinite; }
.medal { position: relative; width: 104px; height: auto; animation: medal .9s cubic-bezier(.2, 1.5, .4, 1) both; filter: drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
.clear { position: relative; font-weight: 800; font-size: 13px; letter-spacing: .14em; color: var(--pop); margin-top: 6px; }
.rank-title { position: relative; font-weight: 800; font-size: 34px; line-height: 1.25; text-wrap: balance; animation: pop .5s .35s cubic-bezier(.2, 1.4, .4, 1) both; }
.rank-msg { position: relative; font-size: 14.5px; max-width: 30em; color: var(--ink); }
.scorebig { position: relative; display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
.scorebig .num { font-size: 72px; font-weight: 800; line-height: 1; color: var(--pop); font-variant-numeric: tabular-nums; }
.scorebig .num.done { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
.scorebig .of { font-size: 22px; font-weight: 800; color: var(--muted); }
.best { position: relative; font-size: 12.5px; font-weight: 800; background: var(--sun); color: #1C1A2E; border-radius: 999px; padding: 3px 12px; }
.stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stamp { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 13px; font-weight: 800; color: var(--brand-deep); background: var(--brand-soft); border-radius: 14px; padding: 8px 6px; animation: stampIn .4s cubic-bezier(.2, 1.6, .4, 1) both; min-width: 0; }
:root:not([data-theme="light"]) .stamp { color: var(--brand); }
.stamp svg { width: 18px; height: 18px; flex: none; color: var(--on); background: var(--brand); border-radius: 50%; padding: 2px; }
.cert { border-radius: 22px; padding: 16px 18px; background: var(--surface); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--pop); display: grid; gap: 4px; }
.cert-k { font-size: 11px; font-weight: 800; letter-spacing: .16em; color: var(--pop); }
.cert-t { font-size: 18px; font-weight: 800; }
.cert-s { font-size: 13.5px; color: var(--muted); }
.cert-skills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.cert-skills span { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; background: var(--brand-soft); color: var(--ink); }
.cert-f { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; font-weight: 700; color: var(--muted); border-top: 2px dashed var(--line); padding-top: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes medal { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes stampIn { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rays, .medal, .rank-title, .stamp, .scorebig .num.done { animation: none; } }
.home { align-self: center; margin-top: 8px; font: inherit; font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 8px 18px; box-shadow: 0 3px 0 var(--line); }
.home:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.home:focus-visible { outline: 3px solid var(--pop); outline-offset: 3px; }
.cases { display: grid; gap: 10px; }
.case { font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; padding: 8px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.case:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.case img { width: 84px; height: 60px; object-fit: cover; border-radius: 12px; display: block; }
.case span { min-width: 0; font-weight: 800; font-size: 15px; line-height: 1.45; }
.case b { display: block; font-size: 11px; letter-spacing: .1em; color: var(--pop); }
.case small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.case .badge { display: inline-block; margin-top: 3px; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; background: var(--brand-soft); color: var(--ink); }
.case .badge.perfect { background: var(--sun); color: #1C1A2E; }

<script>
const STEP_LABELS = {

const TIPS = {

function playClip(key, fallback) {
  stopAll();
  const setSpeaking = (on) => { const x = document.getElementById("say"); x && x.classList.toggle("speaking", on); };
  try {
    const a = new Audio(`voice/${key}.mp3`); clip = a;
    a.onplay = () => setSpeaking(true);
    a.onended = () => { setSpeaking(false); if (clip === a) clip = null; };
    const p = a.play();
    if (p && p.catch) p.catch(() => { if (clip === a && fallback) speak(fallback); });
    a.onerror = () => { if (clip === a && fallback) speak(fallback); };
  } catch (e) { if (fallback) speak(fallback); }
}
function speakCurrent() {
  const sc = S[state.i];
  stopAll();
  if (state.voice === false || !sc.q || (state.ans[sc.q] && state.ans[sc.q].checked)) return;
  playClip(sc.q, questionSpeech(sc.q));
}
function renderVoice() {
  const on = state.voice !== false, b = $("#voice");
  b.setAttribute("aria-pressed", String(on)); $("#voiceLbl").textContent = on ? "音声ON" : "音声OFF";
}
main.addEventListener("change", (e) => {
  if (e.target.id !== "voiceSel") return;
  jaVoice = jaVoices.find((v) => v.name === e.target.value) || jaVoice;
  try { localStorage.setItem("kampo-voice", jaVoice ? jaVoice.name : ""); } catch (er) {}
  speak("この声で読み上げます。");
});

  else location.reload();
});
$("#voice").addEventListener("click", () => {
  state.voice = state.voice === false; renderVoice(); save();
  if (state.voice) speakCurrent(); else stopAll();
});

function burst(ox = 0.5, oy = 0.75, count = 36) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--brand", "--pop", "--sun", "--ng"].map((v) => cs.getPropertyValue(v).trim());
  const W = innerWidth, H = innerHeight;
  for (let n = 0; n < count; n++) {
    const d = document.createElement("div"); d.className = "confetti";
    d.style.background = cols[n % cols.length];
    document.body.appendChild(d);
    const x0 = W * ox, y0 = H * oy, ang = (Math.random() * 0.9 + 0.05) * Math.PI, sp = 260 + Math.random() * 320;
    const dx = Math.cos(ang) * sp * (Math.random() < .5 ? -1 : 1) * 0.8, dy = -Math.sin(ang) * sp - 120;
    const rot = (Math.random() * 720 - 360);
    d.animate([
      { transform: `translate(${x0}px, ${y0}px) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${x0 + dx}px, ${y0 + dy}px) rotate(${rot / 2}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${x0 + dx * 1.3}px, ${y0 + dy + 420}px) rotate(${rot}deg)`, opacity: 0 },
    ], { duration: 1200 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => d.remove();
  }
}
function start(data) { if (data && typeof data.i === "number") state = data; else load(); S = buildScreens(state.role); if (state.i >= S.length) state.i = 0; render(); }
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
